name: Deploy marketing

on:
  push:
    branches: [main]
    paths: ['marketing/**', 'scripts/build-marketing.mjs', '.github/workflows/deploy-marketing.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MARKETING }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The brochure site is hand-written HTML and CSS. There are no dependencies
      # to install: the build copies the directory and verifies it ships no scripts.
      - run: npm run build:marketing
      - name: Publish to Azure Static Web Apps
        if: env.DEPLOYMENT_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.DEPLOYMENT_TOKEN }}
          action: upload
          app_location: dist/marketing/browser
          output_location: ''
          skip_app_build: true
