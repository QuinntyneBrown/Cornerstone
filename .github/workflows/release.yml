name: Release

on:
  push:
    branches: [main, next]
    paths:
      - 'projects/cornerstone/**'
      - 'package.json'
      - 'package-lock.json'
      - 'release.config.mjs'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run api:check
      - run: npm run trace:check
      - run: npm run schematics:test
      - run: npm run architecture:check
      - run: npm run lint
      - run: npm test
      - run: npm run pack:check
      - run: npm run size:check
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
