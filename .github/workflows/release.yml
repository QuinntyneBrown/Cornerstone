name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validate.yml

  turn:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 310
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
      - run: node tools/release/wait-turn.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: [verify, turn]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      actions: read
      id-token: write
    concurrency:
      group: npm-paired-release-main
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: validated-packages
          path: dist
      - run: npm run release:publish
        env:
          GH_TOKEN: ${{ github.token }}
