name: Deploy design system

on:
  push:
    branches: [main]
    paths:
      [
        'design-system/**',
        'projects/cornerstone/**',
        'package*.json',
        'angular.json',
        'tsconfig.json',
      ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DESIGN_SYSTEM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:docs
      - name: Publish to Azure Static Web Apps
        if: env.DEPLOYMENT_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.DEPLOYMENT_TOKEN }}
          action: upload
          app_location: dist/design-system/browser
          output_location: ''
          skip_app_build: true
