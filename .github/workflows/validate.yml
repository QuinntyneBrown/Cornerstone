name: Validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run api:check
      - run: npm run trace:check
      - run: npm run schematics:test
      - run: npm run architecture:check
      - run: npm run lint
      - run: npm run typecheck:e2e
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run test:tokens
      - run: npm run test:release
      - run: npm run build
      - run: npm run verify:consumer
      - run: npm run pack:check
      - run: npm run size:check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e
      - run: npm run release:dry-run
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload validated packages
        uses: actions/upload-artifact@v7
        with:
          name: validated-packages
          path: |
            dist/cornerstone
            dist/design-system-tokens
          retention-days: 30
          if-no-files-found: error
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            verification/playwright-report
            verification/playwright-results
          if-no-files-found: ignore
